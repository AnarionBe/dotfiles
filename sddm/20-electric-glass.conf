# Surcharge locale de la configuration SDDM.
#
# Le préfixe 20- fait passer ce fichier APRÈS 10-endeavouros.conf dans l'ordre
# alphabétique de /etc/sddm.conf.d/, donc il le surcharge.
#
# Ne jamais éditer 10-endeavouros.conf : il appartient au paquet
# eos-breeze-sddm et n'est PAS dans son tableau `backup` pacman — il est
# réécrit à chaque mise à jour, sans .pacnew.
#
# C'est aussi le point de rollback : remettre Current=maldives ici suffit à
# retrouver un écran de connexion fonctionnel.

[Theme]
Current=electric-glass

[General]
# Neutralise le clavier virtuel imposé par 10-endeavouros.conf.
# La valeur par défaut amont (/usr/lib/sddm/sddm.conf.d/default.conf) est
# elle aussi vide.
InputMethod=

# Filet de sécurité : qqc2-desktop-style et qqc2-breeze-style sont installés.
# Si un paquet KDE déposait un /etc/xdg/qtquickcontrols2.conf avec
# Style=org.kde.desktop, org.kde.* reviendrait par la porte de derrière.
GreeterEnvironment=QT_QUICK_CONTROLS_STYLE=Basic
