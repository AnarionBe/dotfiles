# Kitty Terminal - Thème Glassmorphism Bleu Électrique
# Placer dans ~/.config/kitty/kitty.conf

# === APPARENCE GLASSMORPHISME ===
background_opacity 0.85
background_blur 12
dynamic_background_opacity yes

# === COULEURS THÈME SOMBRE BLEU ÉLECTRIQUE ===
foreground #c8ffff
background #0a0a14
cursor #00ffff
cursor_text_color #0a0a14

# === PALETTE DE COULEURS ===
# Noir
color0 #1a1a2e
color8 #2a2a3e

# Rouge
color1 #ff5555
color9 #ff7777

# Vert
color2 #50fa7b
color10 #70fa9b

# Jaune
color3 #f1fa8c
color11 #f1fac8

# Bleu
color4 #00ffff
color12 #00ffff

# Magenta
color5 #ff79c6
color13 #ff99d6

# Cyan
color6 #8be9fd
color14 #aef9fd

# Blanc
color7 #bfbfbf
color15 #dfdfdf

# === CONFIGURATION FENÊTRE ===
window_border_width 2px
window_margin_width 8px
window_padding_width 12px
draw_border_bell no
window_border_color #00ffff
active_border_color #00ffff
inactive_border_color rgba(0, 255, 255, 0.3)
bell_border_color #ff5555

# === EFFETS VISUELS ===
enable_audio_bell no
visual_bell_duration 0.1
window_alert_on_bell yes

# === TABS ===
tab_bar_style fade
tab_fade 0.25 0.5 0.75
active_tab_foreground #00ffff
active_tab_background rgba(0, 255, 255, 0.15)
active_tab_font_style bold
inactive_tab_foreground rgba(200, 255, 255, 0.6)
inactive_tab_background rgba(20, 20, 40, 0.4)

# === FONTS ===
font_family JetBrains Mono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12

# === PERFORMANCE ===
repaint_delay 10
input_delay 3
sync_to_monitor yes